name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Official Python images instead of actions/setup-python: the newest
    # runner images no longer ship builds of older Pythons (3.8, 3.9).
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Byte-compile
        run: python -m py_compile msgraph_sendmail.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test --help and --dry-run
        run: |
          python msgraph_sendmail.py --version
          python msgraph_sendmail.py --help
          printf 'From: ci@b.example\nTo: a@b.example\nSubject: ci\n\nbody\n' \
            | python msgraph_sendmail.py -t --dry-run
