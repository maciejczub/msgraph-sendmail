# msgraph-sendmail configuration
#
# Copy to /etc/msgraph-sendmail.conf (system-wide) or
# ~/.config/msgraph-sendmail.conf (per user) and fill in the values
# from your Entra ID app registration (see docs/azure-setup.md).
#
# This file contains a secret — restrict access:
#     chmod 600 /etc/msgraph-sendmail.conf
#     chown root:root /etc/msgraph-sendmail.conf

[msgraph]
# Tenant ID (GUID) or any verified domain of your tenant, e.g. contoso.com
tenant = 00000000-0000-0000-0000-000000000000

# Application (client) ID of the app registration
client_id = 00000000-0000-0000-0000-000000000000

# Client secret VALUE (not the secret ID!).  Alternatively point
# client_secret_file at a file containing only the secret.
client_secret = your-client-secret-value
#client_secret_file = /etc/msgraph-sendmail.secret

# Default sender mailbox, used when the message has no From: header and
# no -f/--from was given.  Must be a real, licensed mailbox (or shared
# mailbox) in your tenant.
from = noreply@example.com

# Keep a copy of sent messages in the mailbox's Sent Items folder.
# Default: true
#save_to_sent = true

# HTTP timeout in seconds.  Default: 30
#timeout = 30

# --- Local addresses (root, cron job owners, www-data@thishost, ...) ---
# Mail to local addresses is resolved like an MTA would: [aliases] below,
# then aliases_file, then local_recipient.  Test with:
#     msgraph-sendmail -bv root www-data

# Catch-all mailbox for local names without an alias (like nullmailer's
# adminaddr).  Without it, mail to an unknown local name fails (exit 67).
#local_recipient = admin@example.com

# System aliases file in aliases(5) format.  Default: /etc/aliases
# (silently skipped if missing).  Set to an empty value to disable.
#aliases_file = /etc/aliases

# Domains treated as "this host".  Default: localhost,
# localhost.localdomain, the host name and FQDN — never the domain of
# 'from' above.  An explicit list replaces the defaults.
#local_domains = localhost, web01, web01.corp.example

#[aliases]
#root = admin@example.com
#www-data = webdev@example.com, admin@example.com
